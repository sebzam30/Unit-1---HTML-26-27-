<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Lesson 10 Sandbox</title>
    <style>
        header {
            background-color: #101A2B;
            color: white;
        }

        footer {
            background-color: #E2E8F0;
        }

        nav {
            background-color: #DBEAFE;
        }

        aside {
            background-color: #FEF3C7;
        }

        main {
            background-color: #F0FDF4;
        }

        section {
            border-left: 4px solid #5ADB8C;
            padding-left: 10px;
        }

        article {
            border: 2px solid #94A3B8;
            border-radius: 8px;
            padding: 6px 12px;
        }
    </style>
</head>

<body>
    <header>My Page</header>
    <p>Page content…</p>
    <footer>© 2025 Me</footer>
    <hr>

    <nav>Home · About · Posts</nav>
    <p>The article everyone came to read…</p>
    <aside>Fun fact: octopuses have three hearts.</aside>
    <hr>

    <main>
        <section>Welcome to my site…</section>
        <section>Latest news…</section>
    </main>
    <hr>
    
    <article>
        <h2>Why rain smells good</h2>
        <p>The smell is petrichor — oil from dry soil meeting rain…</p>
    </article>


</body>

</html>
