<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Semantic Blog Page</title>
    <style>
        header {
            background: #101A2B;
            color: white;
        }

        nav {
            background: #DBEAFE;
        }

        main {
            background: #F0FDF4;
        }

        aside {
            background: #FEF3C7;
        }

        footer {
            background: #E2E8F0;
        }

        article {
            border: 2px solid #94A3B8;
            border-radius: 8px;
            padding: 6px 12px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Sam's Blog</h1>
    </header>

    <nav>
        <a href="#">Home</a> ·
        <a href="#">Posts</a> ·
        <a href="#">About</a>
    </nav>

    <main>
        <article>
            <h2>Post 1</h2>
            <p>...</p>
        </article>
        <article>
            <h2>Post 2</h2>
            <p>...</p>
        </article>
    </main>

    <aside>About me...</aside>

    <footer>© 2026 Sam</footer>
</body>

</html>
