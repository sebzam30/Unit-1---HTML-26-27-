<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers and Identity</title>
    <style>
        .highlight {
            background-color: orange;
        }
        #site-footer {
            color: purple;
        }
        .card {
            border: 3.5px solid rgb(255, 132, 0);
            border-radius: 10px;
            background-color: yellow
        }
        #main-nav{
            color:white;
            background:navy;
        }
        .price{
            color: rgb(83, 120, 9)
        }
    </style>
</head>

<body>
    <nav id="main-nav">{nav links}</nav>

    <p class="highlight">First note</p>
    <p class="highlight">Second note</p>
    <p class="highlight">Third note</p>

    <div class="card">
        <h2>Product A</h2>
        <p>First Product</p>
    </div> <br>
    <div class="card">
        <h2>Product B</h2>
        <p>Second Product</p>
    </div>

    <p>The price is <span class="price">$29</span> today only!</p>

    <footer id="site-footer">
        @2026 CLUB SIGN UP
    </footer>
</body>

</html>
