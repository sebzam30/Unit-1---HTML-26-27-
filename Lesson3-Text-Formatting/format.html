<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <h1>My personal website</h1>
        <h2>About me</h2>
            <h3>Where I grew up</h3>
        
        <h2>My interests</h2>
            <h3>Rowing</h3>
            <h3>Video games</h3>

        <p>This is <b>bold</b> text</p> <!-- Gets read flat on screen readers -->
        <p>This is <strong>strong</strong> text</p> <!-- Gets read with emphasis on screen readers -->

        <p>This is <i>italic</i> text</p> <!-- Gets read flat on screen readers -->
        <p>This is <em>emphasized</em> text</p> <!-- Gets read with emphasis on screen readers -->

        <p>This is <strong><em>strong emphasized</em></strong> text</p> <!-- Nesting tags -->

        <p>
            P. Sherman <br>
            42 Wallaby Way <br>
            Sydney, Australia
            <hr>
        </p>
</body>
</html>
