<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Stats</title>
</head>

<body>
    <h1>Squad Stats</h1>
    <table border="2">
        <caption>Squad Stats - Last Match</caption>
        <thead>
            <tr>
                <td align="center">Role</td>
                <td align="center">Player</td>
                <td align="center">Kills</td>
                <td align="center">Deaths</td>
                <td align="center">Assists</td>
            </tr>
            <tr>
                <td align="center" rowspan="3">Starting</td>
                <td align="center">Player A</td>
                <td align="center">10</td>
                <td align="center">2</td>
                <td align="center">5</td>
            </tr>
            <tr>
                <td align="center">Player B</td>
                <td align="center">8</td>
                <td align="center">3</td>
                <td align="center">4</td>
            </tr>
            <tr>
                <td align="center">Player C</td>
                <td align="center">6</td>
                <td align="center">4</td>
                <td align="center">7</td>
            </tr>
            <tr>
                <td align="center" rowspan="2">Bench</td>
                <td align="center">Player D</td>
                <td align="center">3</td>
                <td align="center">5</td>
                <td align="center">2</td>
            </tr>
            <tr>
                <td align="center">Player E</td>
                <td align="center">2</td>
                <td align="center">6</td>
                <td align="center">1</td>
            </tr>
            <tr>
                <td align="center">Team Total</td>
                <td align="center" colspan="4">29 Kills, 20 Deaths, 19 Assists</td>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <td align="center" colspan="5">
                    <p><em>Stats from match on Oct 12. Starters led in kills; bench provided support</em></p>
                </td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
